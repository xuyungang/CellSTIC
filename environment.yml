# CellSTIC conda environment
# Create: conda env create -f environment.yml
# Update: conda env update -f environment.yml --prune

name: cellstic
channels:
  - pytorch
  - dglteam
  - conda-forge
  - defaults

dependencies:
  - python>=3.8,<3.11
  - pip

  # Scientific stack
  - numpy>=1.20
  - pandas>=1.3
  - scipy>=1.7
  - scikit-learn>=1.0
  - matplotlib>=3.4
  - pyyaml>=5.4
  - h5py>=3.0
  - tqdm>=4.62
  - jupyterlab>=3
  - ipykernel>=6

  # PyTorch (CPU or CUDA: adjust cuda version as needed)
  - pytorch>=1.10
  - torchvision
  - torchaudio

  # DGL: install from dglteam or pip (pip often has better CUDA match)
  # - dgl  # uncomment if available for your cuda; else use pip below

  # Pip-only / version-sensitive
  - pip:
    - anndata>=0.8
    - scanpy>=1.9
    - scikit-misc>=0.1
    - celltypist>=1.0
    - igraph>=0.9
    - networkx>=2.8
    - louvain>=0.8
    - dgl  # use pip if conda dgl doesn't match your cuda
    - FlagEmbedding
    - openai>=1.0
    # Resource benchmark sampling
    - psutil>=5.9
    - nvidia-ml-py
    # Supplementary table export
    - openpyxl>=3.0
